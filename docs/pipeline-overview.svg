<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="#F8F9FB" rx="8"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">C0D3Collective Pipeline — Visão Geral</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666">Atualização semanal automática via GitHub Actions</text>

  <!-- SECTION: TRIGGER -->
  <rect x="30" y="80" width="130" height="68" rx="8" fill="#E8EDF7" stroke="#6B85C7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#2C3E7A">GitHub Actions</text>
  <text x="95" y="124" text-anchor="middle" font-size="11" fill="#2C3E7A">Cron: seg 06h UTC</text>
  <text x="95" y="139" text-anchor="middle" font-size="10" fill="#666">semanal / ajustável</text>

  <!-- Arrow trigger → pipeline -->
  <line x1="160" y1="114" x2="192" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SECTION: COLLECTORS -->
  <rect x="192" y="68" width="145" height="140" rx="8" fill="#E9F5EC" stroke="#4CAF7A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="265" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E35">Collectors</text>
  <rect x="204" y="99" width="121" height="26" rx="5" fill="#FFF" stroke="#4CAF7A" stroke-width="1"/>
  <text x="265" y="116" text-anchor="middle" font-size="11" fill="#1B5E35">Codeforces API</text>
  <rect x="204" y="131" width="121" height="26" rx="5" fill="#FFF" stroke="#4CAF7A" stroke-width="1"/>
  <text x="265" y="148" text-anchor="middle" font-size="11" fill="#1B5E35">AtCoder / Kenkoooo</text>
  <rect x="204" y="163" width="121" height="26" rx="5" fill="#FFF" stroke="#4CAF7A" stroke-width="1"/>
  <text x="265" y="180" text-anchor="middle" font-size="11" fill="#1B5E35">Kattis (scraping)</text>

  <!-- Arrow collectors → normalizers -->
  <line x1="337" y1="138" x2="368" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="353" y="130" text-anchor="middle" font-size="9" fill="#888">novos</text>

  <!-- SECTION: NORMALIZERS -->
  <rect x="368" y="68" width="155" height="140" rx="8" fill="#FFF3E0" stroke="#E8973A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#7B4A00">Normalizers</text>
  <rect x="380" y="99" width="131" height="26" rx="5" fill="#FFF" stroke="#E8973A" stroke-width="1"/>
  <text x="446" y="116" text-anchor="middle" font-size="11" fill="#7B4A00">Rating Scaler</text>
  <text x="446" y="128" text-anchor="middle" font-size="9" fill="#999">CF / AtCoder / Kattis → CF scale</text>
  <rect x="380" y="142" width="131" height="26" rx="5" fill="#FFF" stroke="#E8973A" stroke-width="1"/>
  <text x="446" y="156" text-anchor="middle" font-size="11" fill="#7B4A00">Rating Predictor</text>
  <text x="446" y="168" text-anchor="middle" font-size="9" fill="#999">Gradient Boosting (+ LLMs)</text>
  <text x="446" y="196" text-anchor="middle" font-size="9" fill="#C86A00" font-style="italic">estimated=True</text>

  <!-- Arrow normalizers → taggers -->
  <line x1="523" y1="138" x2="554" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SECTION: TAGGERS -->
  <rect x="554" y="68" width="155" height="140" rx="8" fill="#F3E5F5" stroke="#9C4FC7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="631" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#4A0070">Taggers</text>
  <rect x="566" y="99" width="131" height="26" rx="5" fill="#FFF" stroke="#9C4FC7" stroke-width="1"/>
  <text x="632" y="116" text-anchor="middle" font-size="11" fill="#4A0070">Similarity (MiniLM)</text>
  <text x="632" y="128" text-anchor="middle" font-size="9" fill="#999">sentence-transformers (free)</text>
  <rect x="566" y="142" width="131" height="26" rx="5" fill="#FFF" stroke="#9C4FC7" stroke-width="1"/>
  <text x="632" y="159" text-anchor="middle" font-size="11" fill="#4A0070">Ensemble Tagger</text>
  <text x="632" y="171" text-anchor="middle" font-size="9" fill="#999">votação por maioria</text>
  <text x="632" y="196" text-anchor="middle" font-size="9" fill="#7B00B0" font-style="italic">+LLMs via config.yaml</text>

  <!-- Arrow taggers → publisher -->
  <line x1="709" y1="138" x2="740" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SECTION: PUBLISHER -->
  <rect x="740" y="80" width="128" height="68" rx="8" fill="#E3F2FD" stroke="#2196C5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="804" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#0D3C6E">Publisher</text>
  <text x="804" y="121" text-anchor="middle" font-size="11" fill="#0D3C6E">Zenodo REST API</text>
  <text x="804" y="136" text-anchor="middle" font-size="10" fill="#666">nova versão automática</text>

  <!-- Outputs section -->
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#444">Saídas</text>

  <!-- Output: CSV -->
  <rect x="80" y="280" width="160" height="68" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F">data/c0d3collective.csv</text>
  <text x="160" y="322" text-anchor="middle" font-size="10" fill="#546E7A">dataset completo</text>
  <text x="160" y="337" text-anchor="middle" font-size="10" fill="#546E7A">atualizado e commitado</text>

  <!-- Output: Zenodo -->
  <rect x="280" y="280" width="160" height="68" rx="8" fill="#E3F2FD" stroke="#2196C5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#0D3C6E">Zenodo</text>
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#0D3C6E">DOI: 10.5281/zenodo</text>
  <text x="360" y="335" text-anchor="middle" font-size="10" fill="#0D3C6E">.16294115 (conceito)</text>

  <!-- Output: C0D3lytics -->
  <rect x="480" y="280" width="160" height="68" rx="8" fill="#E8F5E9" stroke="#4CAF7A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E35">C0D3lytics</text>
  <text x="560" y="320" text-anchor="middle" font-size="10" fill="#1B5E35">visualizador de dados</text>
  <text x="560" y="335" text-anchor="middle" font-size="10" fill="#1B5E35">recomendação ZDP</text>

  <!-- Output: GitHub -->
  <rect x="680" y="280" width="150" height="68" rx="8" fill="#F3E5F5" stroke="#9C4FC7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="755" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#4A0070">GitHub Actions</text>
  <text x="755" y="320" text-anchor="middle" font-size="10" fill="#4A0070">log de execução</text>
  <text x="755" y="335" text-anchor="middle" font-size="10" fill="#4A0070">artefato do CSV</text>

  <!-- Connecting lines from pipeline area down to outputs -->
  <line x1="265" y1="208" x2="160" y2="280" stroke="#AAA" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="445" y1="208" x2="360" y2="280" stroke="#AAA" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="631" y1="208" x2="560" y2="280" stroke="#AAA" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="804" y1="148" x2="755" y2="280" stroke="#AAA" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Data flow label -->
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#888">Problemas novos são anexados (append-only). IDs existentes não são duplicados.</text>
  <text x="450" y="438" text-anchor="middle" font-size="11" fill="#888">Toda previsão de dificuldade ou tag carrega estimated=True (premissa de pesquisa).</text>

  <!-- Legend -->
  <rect x="30" y="460" width="840" height="62" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1"/>
  <text x="50" y="478" font-size="11" font-weight="600" fill="#444">Legenda:</text>
  <rect x="110" y="468" width="12" height="12" rx="2" fill="#E9F5EC" stroke="#4CAF7A" stroke-width="1"/>
  <text x="126" y="479" font-size="10" fill="#444">Coleta de dados</text>
  <rect x="230" y="468" width="12" height="12" rx="2" fill="#FFF3E0" stroke="#E8973A" stroke-width="1"/>
  <text x="246" y="479" font-size="10" fill="#444">Normalização</text>
  <rect x="340" y="468" width="12" height="12" rx="2" fill="#F3E5F5" stroke="#9C4FC7" stroke-width="1"/>
  <text x="356" y="479" font-size="10" fill="#444">Classificação de tópicos</text>
  <rect x="490" y="468" width="12" height="12" rx="2" fill="#E3F2FD" stroke="#2196C5" stroke-width="1"/>
  <text x="506" y="479" font-size="10" fill="#444">Publicação</text>
  <rect x="580" y="468" width="12" height="12" rx="2" fill="#E8EDF7" stroke="#6B85C7" stroke-width="1"/>
  <text x="596" y="479" font-size="10" fill="#444">Trigger / Orquestração</text>
  <text x="50" y="511" font-size="10" fill="#888" font-style="italic">COD3LYTICS · Mestrado PPGTI-IFPB · Andressa Theotônio · 2026</text>
</svg>
