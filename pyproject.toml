[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c0d3collective-pipeline"
version = "0.1.0"
description = "Auto-updating pipeline for the C0D3Collective competitive programming dataset"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "sentence-transformers>=2.6",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "xgboost>=2.0",
]

[tool.setuptools.packages.find]
include = ["collectors*", "normalizers*", "taggers*", "publishers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
